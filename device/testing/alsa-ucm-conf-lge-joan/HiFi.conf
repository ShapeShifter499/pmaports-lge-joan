# LG V30 (joan) HiFi use case.
#
# Three outputs, all confirmed by ear on hardware:
#
#   MultiMedia1 -> QUAT_MI2S_RX  -> ES9218P "Quad DAC" -> headphone jack
#   MultiMedia1 -> TERT_MI2S_RX  -> TFA9872 amplifier  -> loudspeaker
#   MultiMedia1 -> SLIMBUS_0_RX  -> WCD9340 RX INT0    -> EAR PA -> earpiece
#
# and four inputs, off the WCD9340's analog mics:
#
#   AMIC1/ADC1 -> DEC6 -> SLIM TX6 \
#   AMIC3/ADC3 -> DEC8 -> SLIM TX8  > SLIMBUS_0_TX -> MultiMedia2
#   AMIC2/ADC2 -> DEC0 -> SLIM TX0 /
#
# Mic wiring is transcribed from the stock LG mixer_paths_tavil.xml pulled off
# the retail vendor image:
#
#   ADC1  bottom / handset mic     ("amic1", "handset-mic")
#   ADC2  headset (in-line) mic    ("amic2", "headset-mic")
#   ADC3  top / secondary mic      ("amic3", "speaker-mic")
#   ADC4  third built-in mic       (camcorder + factory test only, not used here)
#
# joan has no digital mics: every path LG names "*-dmic-*" in that file
# actually selects analog mics, and the one path that really does select a
# DMIC (speaker-mic-liquid) is for Qualcomm's Liquid reference board.
#
# Playback runs on MultiMedia1 (hw:x,0) and capture on MultiMedia2 (hw:x,1),
# matching the shipped Qualcomm sdm845 profile.  Mainline needs no equivalent
# of downstream's "SLIM_0_TX Channels" control: wcd934x builds the SLIMbus
# channel list from whichever "AIF1_CAP Mixer SLIM TXn" switches are on, and
# sdm845.c passes that straight to the CPU DAI, so enabling two TX ports is
# what makes the stream stereo.
#
# Each device enables only its own path and tears it down again on disable, so
# selecting one output does not leave another fed.  Nothing is enabled at the
# verb level: the earpiece needs SLIMBUS_0_RX on while the other two need it
# off, so that state belongs to the devices, not to the use case.
#
# "DECn Volume" is SOC_SINGLE_S8_TLV over (-84, +40): the value is an OFFSET
# FROM MIN, so 84 is 0 dB and 0 would be -84 dB.  "ADCn Volume" is an ordinary
# 0..20 analog gain and the numbers below are LG's own.
#
# The capture devices ask the ADSP for a real processing chain rather than the
# bit-transparent one mainline has always used: "SM ECNS" for a single mic and
# "DM Fluence" for the pair, which is the mapping LG's own calibration data
# uses (VPM_TX_SM_ECNS in Headset_cal.acdb, VPM_TX_DM_FLUENCE in
# Handset_cal.acdb).  If the ADSP refuses a topology the COPP open fails and
# capture stops working entirely, so if a mic goes silent, the first thing to
# try is
#
#     amixer -c0 cset name='TX COPP Topology' None
#
# which restores exactly the old behaviour without touching anything else.
#
# Not yet confirmed on hardware.
Syntax 3

SectionVerb {
	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Loudspeaker (TFA9872, tertiary MI2S)"

	Value {
		PlaybackPriority 150
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackVolume "Speaker Playback Volume"
	}

	EnableSequence [
		# The driver brings the amplifier up itself once the route is on.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"

		# TDMSPKG is an attenuation in hardware (0 = loudest), and the
		# control is registered inverted, so this 0..15 scale runs the
		# usual way round: 15 is loudest.
		#
		# mainline's tfa989x bypasses the CoolFlux DSP, so SpeakerBoost
		# and the excursion limiter are not running: there is NO speaker
		# protection.  Come up well short of maximum and let the user
		# raise it.  The route and the control are verified; this
		# particular gain is a deliberately conservative choice.
		cset "name='Speaker Playback Volume' 8"
	]

	DisableSequence [
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Earpiece" {
	Comment "Earpiece (WCD9340 EAR PA, SLIMbus)"

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 1
		PlaybackVolume "RX0 Digital Volume"
	}

	EnableSequence [
		# The seven stages that were verified together on hardware.
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 1"
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0_1 INTERP' RX INT0_1 MIX1"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0_2 INTERP' RX INT0_2 MUX"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"

		# RX0 Digital Volume is SOC_SINGLE_S8_TLV: the value is an
		# OFFSET FROM MIN, not a dB figure and not a percentage.  On the
		# (-84, +40) range that this control carries, 84 is 0 dB and 0
		# would be -84 dB, i.e. silence.  84 is the verified value.
		cset "name='RX0 Digital Volume' 84"
		# EAR PA analog gain: 4 is +6 dB, the verified value.
		cset "name='EAR PA Volume' 4"
	]

	DisableSequence [
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_2 INTERP' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Headphones" {
	Comment "Headphone jack (ES9218P Quad DAC)"

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		# Hand the sound server the DAC's own controls so the desktop
		# volume slider drives real hardware attenuation. Syntax 3 wants
		# the bare control name, as the shipped sdm845 profile does.
		PlaybackVolume "Headphone Playback Volume"
		PlaybackSwitch "Headphone Playback Switch"
	}

	EnableSequence [
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='Headphone Playback Switch' on"
		# 0 dB is full scale on this amplifier and is uncomfortably loud;
		# come up at roughly -30 dB and let the user raise it.
		cset "name='Headphone Playback Volume' 195"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]
}

SectionDevice."Mic" {
	Comment "Built-in mic (bottom, WCD9340 AMIC1)"

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC1 Volume"
	}

	EnableSequence [
		cset "name='TX COPP Topology' 'SM ECNS'"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"

		cset "name='DEC6 Volume' 84"
		cset "name='ADC1 Volume' 12"
	]

	DisableSequence [
		cset "name='AMIC MUX6' ZERO"
		cset "name='CDC_IF TX6 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='TX COPP Topology' None"
	]
}

SectionDevice."Headset" {
	Comment "Headset in-line mic (WCD9340 AMIC2)"

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureVolume "ADC2 Volume"
	}

	EnableSequence [
		cset "name='TX COPP Topology' 'SM ECNS'"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='AIF1_CAP Mixer SLIM TX0' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"

		cset "name='DEC0 Volume' 84"
		cset "name='ADC2 Volume' 12"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='CDC_IF TX0 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='TX COPP Topology' None"
	]
}

SectionDevice."DualMic" {
	Comment "Both built-in mics, stereo (AMIC1 + AMIC3)"

	# LG's endfire pair: the bottom mic and the top mic captured together as
	# two channels.  Downstream feeds this to the ADSP's beamformer and
	# noise suppressor for calls and camcorder recording; those live in
	# proprietary ACDB topologies with no mainline equivalent, so what this
	# device gives you is the two raw channels.  Any beamforming or noise
	# suppression has to happen in userspace on top of it.
	#
	# ADC1 goes to channel 0 and ADC3 to channel 1, which is LG's
	# camcorder-0 (portrait) assignment; the stock paths swap the two for
	# 180/270-degree rotation, which userspace would have to do itself.

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},1"
		CaptureChannels 2
	}

	EnableSequence [
		cset "name='TX COPP Topology' 'DM Fluence'"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"

		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' AMIC"
		cset "name='AMIC MUX7' ADC1"

		cset "name='AIF1_CAP Mixer SLIM TX8' 1"
		cset "name='CDC_IF TX8 MUX' DEC8"
		cset "name='ADC MUX8' AMIC"
		cset "name='AMIC MUX8' ADC3"

		cset "name='DEC7 Volume' 84"
		cset "name='DEC8 Volume' 84"
		# LG's own gains for this pair; matched so the two channels stay
		# comparable, which is what any later beamforming depends on.
		cset "name='ADC1 Volume' 6"
		cset "name='ADC3 Volume' 6"
	]

	DisableSequence [
		cset "name='AMIC MUX8' ZERO"
		cset "name='CDC_IF TX8 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX8' 0"

		cset "name='AMIC MUX7' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"

		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='TX COPP Topology' None"
	]
}

# The two camcorder devices below are the stock camcorder-0/90 and
# camcorder-180/270 paths.  LG captures three built-in mics for video and
# swaps which of ADC1/ADC3 lands on channel 0 according to how the phone is
# held; ADC4 is always the third channel.  Nothing selects between them
# automatically -- that is a userspace decision keyed to device rotation, and
# joan has no working camera yet -- but the routing is here for when it does.
#
# Topology is deliberately left at None for these: Fluence beamforms toward a
# single talker and suppresses everything else, which is right for a call and
# wrong for recording a scene.
#
# Stock also puts DMIC0 on a fourth channel here.  Left out, because no
# digital mic has been shown to exist on this board -- see the DTS comment.

SectionDevice."Camcorder" {
	Comment "Camcorder mics, upright (ADC3, ADC1, ADC4)"

	Value {
		CapturePriority 90
		CapturePCM "hw:${CardId},1"
		CaptureChannels 3
	}

	EnableSequence [
		cset "name='TX COPP Topology' None"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"

		cset "name='AIF1_CAP Mixer SLIM TX5' 1"
		cset "name='CDC_IF TX5 MUX' DEC5"
		cset "name='ADC MUX5' AMIC"
		cset "name='AMIC MUX5' ADC3"

		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"

		cset "name='AMIC4_5 SEL Mux' AMIC4"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' AMIC"
		cset "name='AMIC MUX7' ADC4"

		cset "name='DEC5 Volume' 84"
		cset "name='DEC6 Volume' 84"
		cset "name='DEC7 Volume' 84"
		# LG's camcorder gains: 8 on the pair, 0 on the third mic.
		cset "name='ADC3 Volume' 8"
		cset "name='ADC1 Volume' 8"
		cset "name='ADC4 Volume' 0"
	]

	DisableSequence [
		cset "name='AMIC MUX7' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"

		cset "name='AMIC MUX6' ZERO"
		cset "name='CDC_IF TX6 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"

		cset "name='AMIC MUX5' ZERO"
		cset "name='CDC_IF TX5 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX5' 0"

		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]
}

SectionDevice."CamcorderRotated" {
	Comment "Camcorder mics, rotated 180 (ADC1, ADC3, ADC4)"

	# Identical to Camcorder except that ADC1 and ADC3 trade places, which
	# is the whole of the difference between LG's camcorder-0/90 and
	# camcorder-180/270 paths.

	Value {
		CapturePriority 80
		CapturePCM "hw:${CardId},1"
		CaptureChannels 3
	}

	EnableSequence [
		cset "name='TX COPP Topology' None"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"

		cset "name='AIF1_CAP Mixer SLIM TX5' 1"
		cset "name='CDC_IF TX5 MUX' DEC5"
		cset "name='ADC MUX5' AMIC"
		cset "name='AMIC MUX5' ADC1"

		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC3"

		cset "name='AMIC4_5 SEL Mux' AMIC4"
		cset "name='AIF1_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"
		cset "name='ADC MUX7' AMIC"
		cset "name='AMIC MUX7' ADC4"

		cset "name='DEC5 Volume' 84"
		cset "name='DEC6 Volume' 84"
		cset "name='DEC7 Volume' 84"
		cset "name='ADC1 Volume' 8"
		cset "name='ADC3 Volume' 8"
		cset "name='ADC4 Volume' 0"
	]

	DisableSequence [
		cset "name='AMIC MUX7' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX7' 0"

		cset "name='AMIC MUX6' ZERO"
		cset "name='CDC_IF TX6 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"

		cset "name='AMIC MUX5' ZERO"
		cset "name='CDC_IF TX5 MUX' ZERO"
		cset "name='AIF1_CAP Mixer SLIM TX5' 0"

		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
	]
}
