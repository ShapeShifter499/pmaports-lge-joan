# joan (LG V30): name the three cameras so camera apps can tell them apart.
#
# Without this, PipeWire derives the node name from the camera's location only,
# and both rear cameras show up as "Built-in Back Camera".
#
# object.path values are the libcamera entity paths, matched against the
# pipeline handlers:
#   i2c-bus@0/camera@10 -> imx351  (main / 16 MP)
#   i2c-bus@1/camera@2d -> s5k3m3  (wide / 13 MP)
#   i2c@c1b6000/camera@20 -> hi553 (front)
monitor.libcamera.rules = [
  {
    matches = [ { object.path = "libcamera:/base/soc@0/cci@ca0c000/i2c-bus@0/camera@10" } ]
    actions = { update-props = { node.description = "Back Camera" } }
  }
  {
    matches = [ { object.path = "libcamera:/base/soc@0/cci@ca0c000/i2c-bus@1/camera@2d" } ]
    actions = { update-props = { node.description = "Back Wide Camera" } }
  }
  {
    matches = [ { object.path = "libcamera:/base/soc@0/i2c@c1b6000/camera@20" } ]
    actions = { update-props = { node.description = "Front Camera" } }
  }
]
