# joan (LG V30): use the plain ALSA path instead of ACP for the sound card.
#
# WHY: with ACP enabled, WirePlumber's ALSA monitor reported
#     api.acp.auto-port  = "false"
#     api.acp.auto-profile = "false"
# and created no nodes at all, so the device had no sink and no source even
# though the card probed fine and `speaker-test -D hw:0,0` played without
# error. Disabling ACP makes WirePlumber fall back to enumerating the ALSA
# PCMs directly, which produces
#     Sinks:   Built-in Audio
#     Sources: Built-in Audio (MultiMedia2 (*))
#
# This is a workaround, not a cure. It loses UCM-driven routing, so the mixer
# state a UCM EnableSequence would set has to be applied some other way. The
# underlying UCM problems are fixed in alsa-ucm-conf-lg-joan (card ID path,
# ${CardId}, and 31 cset lines that named controls this kernel does not
# expose), but ACP still refuses to build ports here.
#
# Verified 2026-10-12: device + sink + source present on 4/4 WirePlumber
# restarts with this drop-in in place.
monitor.alsa.rules = [
  {
    matches = [ { device.name = "~alsa_card.*" } ]
    actions = { update-props = { api.alsa.use-acp = false } }
  }
]
