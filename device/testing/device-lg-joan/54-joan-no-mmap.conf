# joan (LG V30) -- buffer settings MEASURED from what works on this device,
# not copied from upstream or from Android.
#
# Captured 2026-09-11 by reading /proc/asound/card0/pcm*/sub0/hw_params while
# plain aplay/arecord ran successfully on hw:0,0 and hw:0,1:
#     playback : period_size 6240  buffer 24960  (4 periods, ~130 ms each)
#     capture  : period_size 1920  buffer 15360  (8 periods)
# Capture periods must also stay under the driver's own cap --
# q6asm-dai.c CAPTURE_MAX_PERIOD_SIZE is 4096 *bytes* (2048 frames mono),
# which is why pmaports' shared 51-qcom.conf (period-size 4096 frames) is
# illegal here and glitches.
#
# The q6asm front-ends also cannot be driven by PipeWire's timer-based
# scheduling: capture sits permanently in XRUN and mmap_commit returns -EPIPE,
# while plain arecord on the same device works. Use IRQ-driven periods and
# read/write access, i.e. behave like tinyALSA.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = {
        api.alsa.disable-tsched = true
        api.alsa.disable-mmap   = true
        api.alsa.period-size    = 6240
        api.alsa.period-num     = 4
        api.alsa.headroom       = 0
    } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = {
        api.alsa.disable-tsched = true
        api.alsa.disable-mmap   = true
        api.alsa.period-size    = 1920
        api.alsa.period-num     = 8
        api.alsa.headroom       = 0
    } }
  }
]
