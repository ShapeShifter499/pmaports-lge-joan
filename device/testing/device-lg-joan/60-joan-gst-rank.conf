# joan (LG V30): the Venus H.264 ENCODER through GStreamer v4l2h264enc
# asserts the firmware mid-stream (vbuffer.c:1219, VIDEO.VE.4.4-00058) and
# Venus crash recovery resets the whole SoC (measured 2026-10-06). Decode
# (v4l2h264dec) is healthy. Demote only the encoder until the EOS-on-
# real-buffer fix lands, so encodebin never picks it by rank.
GST_PLUGIN_FEATURE_RANK=v4l2h264enc:none
