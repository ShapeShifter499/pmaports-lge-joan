# clatd configuration (shipped by lg-joan-cellular-data).
# clatd only brings up a CLAT when the active connection has no native IPv4
# default route AND the network's DNS64 advertises a NAT64 prefix (RFC 7050),
# so dual-stack and IPv4 networks are untouched. NetworkManager's dispatcher
# (50-clatd, from the clatd package) restarts clatd on every connection
# up/down, and joan-clat-run points discovery at the current link's servers.
script-up=/usr/libexec/lg-joan-cellular-data/joan-clat-up
script-down=/usr/libexec/lg-joan-cellular-data/joan-clat-down
# Native IPv4 that appears later fires its own dispatcher event (and so a
# restart and a fresh check); no need for clatd's default 10s grace.
v4-conncheck-delay=2
