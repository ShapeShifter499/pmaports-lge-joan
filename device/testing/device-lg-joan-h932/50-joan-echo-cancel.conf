# Mic noise suppression and echo cancellation for the LG V30 (joan).
#
# joan's downstream stack does its noise suppression, echo cancellation and
# two-mic beamforming inside the ADSP, in topologies loaded from LG's
# proprietary ACDB calibration data.  Mainline's q6adm opens every stream with
# NULL_COPP_TOPOLOGY and has no ACDB parser, so none of that processing exists
# here and none of it can be ported without shipping LG's blobs.  What we can
# do instead is the same job in userspace, which is where PipeWire's WebRTC
# filter comes in.
#
# This creates a virtual source that runs the raw mic through WebRTC's noise
# suppressor, high-pass filter and gain control, and cancels whatever the
# loudspeaker is playing back out of it.  The raw hardware source stays
# available alongside it, so capture can still be tested unprocessed.
#
# The four webrtc.* keys below are the complete set understood by the
# libspa-aec-webrtc backend that Alpine ships (webrtc-audio-processing-2);
# anything else is silently ignored.  Note that the two-mic beamformer that
# older webrtc-audio-processing had is gone in the v2 API, so the DualMic UCM
# device gives two raw channels and nothing here beamforms them.
#
# Delete this file to go back to the plain hardware source.

context.modules = [
	{   name = libpipewire-module-echo-cancel
		args = {
			library.name = aec/libspa-aec-webrtc
			aec.args = {
				webrtc.noise_suppression = true
				webrtc.high_pass_filter  = true
				webrtc.gain_control      = true

				# false selects the full AEC3 canceller, which the
				# 835 can afford.  true selects WebRTC's handset
				# mode: cheaper, and tuned for the tighter
				# speaker-to-mic coupling of a phone in
				# speakerphone.  Worth trying both once there is a
				# call to test against.
				webrtc.mobile_mode = false
			}
			source.props = {
				node.name        = "joan_echo_cancel_source"
				node.description = "Mic (noise-cancelled)"
			}
			sink.props = {
				node.name        = "joan_echo_cancel_sink"
				node.description = "Playback (echo-cancel reference)"
			}
		}
	}
]
