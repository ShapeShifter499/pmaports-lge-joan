# Phosh needs longer than systemd's default TimeoutStartSec=90 to come up on
# this device, so without this the shell is killed just after the lock screen
# appears and the whole graphical session tears down.
#
# Measured on a US998, 2026-09-06 (first boot from an SD install):
#
#   10:04:04  Starting Phosh, a shell for mobile phones...
#   10:04:35  pulseaudio: module-alsa-card: Failed to find a working profile
#   10:05:33  (~58s stalled retrying)
#   10:05:34  mobi.phosh.Shell.service: start operation timed out. Terminating.
#   10:06:18  Phosh ready after 122.18s
#   10:06:19  Failed to start Phosh -> Dependency failed for GNOME Session
#
# Phosh itself is healthy; it reports ready, just 32s after systemd gave up.
# The delay comes from PulseAudio failing to find a working profile for the
# "platform-sound" card: the WCD9340 codec sits on SLIMbus, and slim-ngd stops
# at "up_worker entering wait (state 3)" without completing, so the card has no
# usable DAIs. That is the same root cause as the non-working speaker/earpiece.
#
# This is a workaround, not a fix. Drop it once SLIMbus/WCD9340 bring-up works.

[Service]
TimeoutStartSec=300
