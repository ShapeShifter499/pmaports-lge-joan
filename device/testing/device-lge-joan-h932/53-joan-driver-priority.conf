# joan (LG V30): the capture node was winning the graph-driver election
# (priority.driver 1728 vs the sink's 1000), so playback was resampled onto
# the ADSP capture clock -- audible as a wavering pitch on a sustained tone.
# Make the playback device the timing master instead.
monitor.alsa.rules = [
  {
    matches = [ { node.name = "~alsa_output.platform-sound.*" } ]
    actions = { update-props = { priority.driver = 2000 } }
  }
  {
    matches = [ { node.name = "~alsa_input.platform-sound.*" } ]
    actions = { update-props = { priority.driver = 900 } }
  }
]
