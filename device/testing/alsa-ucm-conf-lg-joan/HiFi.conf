# HiFi use case for the LG V30 (joan).
#
# One frontend PCM per device, after the sdm845 phones (OnePlus 6,
# Poco F1): the verb wires every frontend to its backend once, and a device
# only switches the codec muxes and amplifiers of its own path. No device
# re-routes another device's PCM.
#
# Playback
#  - Speaker             : TFA9872         : MultiMedia1 (hw:,0) -> TERT_MI2S_RX
#  - Earpiece            : WCD9340 EAR PA  : MultiMedia3 (hw:,2) -> SLIMBUS_0_RX (AIF1_PB, RX0 -> INT0)
#  - Headphones          : WCD9340 HPHL/R  : MultiMedia5 (hw:,4) -> SLIMBUS_1_RX (AIF2_PB, RX2/RX3 -> INT1/INT2)
#                          ES9218P in Low Power Bypass passes the WCD through to the jack
#  - Headphones (Hi-Fi)  : ES9218P DAC     : MultiMedia7 (hw:,6) -> QUAT_MI2S_RX
# Capture
#  - Bottom mic          : ADC1 -> DEC6 -> TX6 : MultiMedia2 (hw:,1) <- SLIMBUS_0_TX (AIF1_CAP)
#  - Top mic             : ADC3 -> DEC7 -> TX7 : MultiMedia4 (hw:,3) <- SLIMBUS_1_TX (AIF2_CAP)
#  - Headset mic         : ADC2 -> DEC0 -> TX0 : MultiMedia6 (hw:,5) <- SLIMBUS_2_TX (AIF3_CAP)
#
# Mic wiring is from LG's stock mixer_paths_tavil.xml (amic1 = handset/bottom,
# amic2 = headset, amic3 = speaker-mic/top). The top mic uses DEC7/TX7, as
# LG's dual-mic paths do: DEC8/TX8 records zeros on mainline today.
#
# Headphones have no JackControl. Jack detection does not work on joan yet,
# and a jack that never reports "plugged" would hide both headphone outputs
# for good. Until it does, they are chosen by hand and rank below the speaker.

SectionVerb {
	EnableSequence [
		# Frontend -> backend, one each.
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 1"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 1"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia3' 1"
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 1"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia5' 1"
		cset "name='MultiMedia6 Mixer SLIMBUS_2_TX' 1"
		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia7' 1"

		# SLIMbus RX ports feeding the WCD interpolators.
		cset "name='SLIM RX0 MUX' AIF1_PB"
		cset "name='SLIM RX2 MUX' AIF2_PB"
		cset "name='SLIM RX3 MUX' AIF2_PB"

		# SLIMbus TX ports, one per capture interface.
		#
		# wcd934x keeps each TX port on at most one AIF and silently refuses
		# ("SLIM_TXn PORT is busy") to add it to a second. Its "AIFn_CAP
		# Mixer SLIM TXn" getter ignores the AIF, so a saved mixer state
		# reads "on" for all three AIFs, and alsactl restore at boot hands
		# every port to AIF1 first. AIF2 and AIF3 then have no port, and the
		# ADSP rejects their zero-channel AFE port (error 9 on SLIMBUS_2_TX),
		# which makes the whole profile unavailable. Release each port from
		# the other two AIFs before claiming it. Disabling a port an AIF does
		# not own is a no-op.
		cset "name='AIF2_CAP Mixer SLIM TX6' 0"
		cset "name='AIF3_CAP Mixer SLIM TX6' 0"
		cset "name='AIF1_CAP Mixer SLIM TX6' 1"
		cset "name='CDC_IF TX6 MUX' DEC6"

		cset "name='AIF1_CAP Mixer SLIM TX7' 0"
		cset "name='AIF3_CAP Mixer SLIM TX7' 0"
		cset "name='AIF2_CAP Mixer SLIM TX7' 1"
		cset "name='CDC_IF TX7 MUX' DEC7"

		cset "name='AIF1_CAP Mixer SLIM TX0' 0"
		cset "name='AIF2_CAP Mixer SLIM TX0' 0"
		cset "name='AIF3_CAP Mixer SLIM TX0' 1"
		cset "name='CDC_IF TX0 MUX' DEC0"
	]

	DisableSequence [
		cset "name='CDC_IF TX0 MUX' ZERO"
		cset "name='CDC_IF TX7 MUX' ZERO"
		cset "name='CDC_IF TX6 MUX' ZERO"
		cset "name='AIF3_CAP Mixer SLIM TX0' 0"
		cset "name='AIF2_CAP Mixer SLIM TX7' 0"
		cset "name='AIF1_CAP Mixer SLIM TX6' 0"
		cset "name='SLIM RX3 MUX' ZERO"
		cset "name='SLIM RX2 MUX' ZERO"
		cset "name='SLIM RX0 MUX' ZERO"

		cset "name='QUAT_MI2S_RX Audio Mixer MultiMedia7' 0"
		cset "name='MultiMedia6 Mixer SLIMBUS_2_TX' 0"
		cset "name='SLIMBUS_1_RX Audio Mixer MultiMedia5' 0"
		cset "name='MultiMedia4 Mixer SLIMBUS_1_TX' 0"
		cset "name='SLIMBUS_0_RX Audio Mixer MultiMedia3' 0"
		cset "name='MultiMedia2 Mixer SLIMBUS_0_TX' 0"
		cset "name='TERT_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speaker"

	# The tfa989x driver powers the amplifier with the stream.
	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
		PlaybackMixerElem "Speaker"
		PlaybackVolume "Speaker Playback Volume"
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0_1 INTERP' RX INT0_1 MIX1"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0_2 INTERP' RX INT0_2 MUX"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	]

	DisableSequence [
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_2 INTERP' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		PlaybackMixerElem "RX0 Digital"
		PlaybackVolume "RX0 Digital Volume"
	}
}

SectionDevice."Headphones" {
	Comment "Headphones"

	ConflictingDevice [
		"HeadphonesHiFi"
	]

	EnableSequence [
		# ES9218P mode field (RESET_N + MODE2): Low Power Bypass powers the
		# DAC down and passes the WCD's HPHL/HPHR through to the jack.
		cset "name='Headphone Mode' Low Power Bypass"
		# Class-H Hi-Fi: the Low Power variant is audible as a wavering
		# tone on joan. LG uses CLS_H_HIFI on most of its headphone paths.
		cset "name='RX HPH Mode' Class-H Hi-Fi"

		# Left: RX2 -> interpolator 1 -> HPHL
		cset "name='RX INT1_1 MIX1 INP0' RX2"
		cset "name='RX INT1_1 INTERP' RX INT1_1 MIX1"
		cset "name='RX INT1_2 MUX' RX2"
		cset "name='RX INT1_2 INTERP' RX INT1_2 MUX"
		cset "name='RX INT1 DEM MUX' CLSH_DSM_OUT"
		# Right: RX3 -> interpolator 2 -> HPHR
		cset "name='RX INT2_1 MIX1 INP0' RX3"
		cset "name='RX INT2_1 INTERP' RX INT2_1 MIX1"
		cset "name='RX INT2_2 MUX' RX3"
		cset "name='RX INT2_2 INTERP' RX INT2_2 MUX"
		cset "name='RX INT2 DEM MUX' CLSH_DSM_OUT"
	]

	DisableSequence [
		cset "name='RX INT2 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT2_2 INTERP' ZERO"
		cset "name='RX INT2_2 MUX' ZERO"
		cset "name='RX INT2_1 INTERP' ZERO"
		cset "name='RX INT2_1 MIX1 INP0' ZERO"
		cset "name='RX INT1 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT1_2 INTERP' ZERO"
		cset "name='RX INT1_2 MUX' ZERO"
		cset "name='RX INT1_1 INTERP' ZERO"
		cset "name='RX INT1_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},4"
		PlaybackChannels 2
	}
}

SectionDevice."HeadphonesHiFi" {
	Comment "Headphones (Hi-Fi DAC)"

	ConflictingDevice [
		"Headphones"
	]

	EnableSequence [
		# ES9218P in HiFi: its own DAC and amplifier drive the jack.
		cset "name='Headphone Mode' HiFi"
		cset "name='Headphone Playback Switch' on"
	]

	DisableSequence [
		cset "name='Headphone Playback Switch' off"
		cset "name='Headphone Mode' Low Power Bypass"
	]

	Value {
		PlaybackPriority 90
		PlaybackPCM "hw:${CardId},6"
		PlaybackChannels 2
		PlaybackMixerElem "Headphone"
		PlaybackVolume "Headphone Playback Volume"
		PlaybackSwitch "Headphone Playback Switch"
	}
}

SectionDevice."Mic1" {
	Comment "Bottom Microphone"

	EnableSequence [
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"
	]

	DisableSequence [
		cset "name='AMIC MUX6' ZERO"
		cset "name='ADC MUX6' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Mic2" {
	Comment "Top Microphone"

	EnableSequence [
		cset "name='ADC MUX7' AMIC"
		cset "name='AMIC MUX7' ADC3"
	]

	DisableSequence [
		cset "name='AMIC MUX7' ZERO"
		cset "name='ADC MUX7' ZERO"
	]

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},3"
		CaptureChannels 1
		CaptureMixerElem "ADC3"
		CaptureVolume "ADC3 Volume"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},5"
		CaptureChannels 1
		CaptureMixerElem "ADC2"
		CaptureVolume "ADC2 Volume"
	}
}
