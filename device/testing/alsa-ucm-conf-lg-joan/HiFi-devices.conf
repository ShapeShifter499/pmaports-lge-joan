# Devices shared by the HiFi and Hi-Fi DAC verbs of the LG V30 (joan):
# everything except the headphones. Included from HiFi.conf and
# HiFiDAC.conf.

SectionDevice."Speaker" {
	Comment "Speaker"

	# The tfa989x driver powers the amplifier with the stream.
	#
	# No PlaybackVolume: the amplifier's gain control has 16 steps and no
	# dB scale, so PipeWire put all of the volume on it, and its lowest
	# step is still audible: the speaker never went silent at 0%. Without
	# a hardware volume PipeWire uses a software volume that ends in
	# silence, over a fixed amplifier gain. Keep that gain well short of
	# the maximum: mainline's tfa989x bypasses the CoolFlux DSP, so there
	# is no speaker protection.
	EnableSequence [
		cset "name='Speaker Playback Volume' 8"
	]

	Value {
		PlaybackPriority 200
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}

SectionDevice."Earpiece" {
	Comment "Earpiece"

	EnableSequence [
		cset "name='RX INT0_1 MIX1 INP0' RX0"
		cset "name='RX INT0_1 INTERP' RX INT0_1 MIX1"
		cset "name='RX INT0_2 MUX' RX0"
		cset "name='RX INT0_2 INTERP' RX INT0_2 MUX"
		cset "name='RX INT0 DEM MUX' CLSH_DSM_OUT"
	]

	DisableSequence [
		cset "name='RX INT0 DEM MUX' NORMAL_DSM_OUT"
		cset "name='RX INT0_2 INTERP' ZERO"
		cset "name='RX INT0_2 MUX' ZERO"
		cset "name='RX INT0_1 INTERP' ZERO"
		cset "name='RX INT0_1 MIX1 INP0' ZERO"
	]

	Value {
		PlaybackPriority 50
		PlaybackPCM "hw:${CardId},2"
		PlaybackChannels 1
		PlaybackMixerElem "RX0 Digital"
		PlaybackVolume "RX0 Digital Volume"
	}
}

SectionDevice."Mic bottom" {
	Comment "Bottom Microphone"

	EnableSequence [
		cset "name='ADC MUX6' AMIC"
		cset "name='AMIC MUX6' ADC1"
	]

	DisableSequence [
		cset "name='AMIC MUX6' ZERO"
		cset "name='ADC MUX6' ZERO"
	]

	Value {
		CapturePriority 200
		CapturePCM "hw:${CardId},1"
		CaptureChannels 1
		CaptureMixerElem "ADC1"
		CaptureVolume "ADC1 Volume"
	}
}

SectionDevice."Mic top" {
	Comment "Top Microphone"

	EnableSequence [
		cset "name='ADC MUX7' AMIC"
		cset "name='AMIC MUX7' ADC3"
	]

	DisableSequence [
		cset "name='AMIC MUX7' ZERO"
		cset "name='ADC MUX7' ZERO"
	]

	Value {
		CapturePriority 150
		CapturePCM "hw:${CardId},3"
		CaptureChannels 1
		CaptureMixerElem "ADC3"
		CaptureVolume "ADC3 Volume"
	}
}

SectionDevice."Headset" {
	Comment "Headset Microphone"

	EnableSequence [
		cset "name='ADC MUX0' AMIC"
		cset "name='AMIC MUX0' ADC2"
	]

	DisableSequence [
		cset "name='AMIC MUX0' ZERO"
		cset "name='ADC MUX0' ZERO"
	]

	Value {
		CapturePriority 100
		CapturePCM "hw:${CardId},5"
		CaptureChannels 1
		JackControl "Headset Mic Jack"
		CaptureMixerElem "ADC2"
		CaptureVolume "ADC2 Volume"
	}
}
