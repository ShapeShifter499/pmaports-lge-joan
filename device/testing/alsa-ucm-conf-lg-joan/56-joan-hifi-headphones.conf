# joan (LG V30): settings for the Hi-Fi DAC headphones output.
#
# Form factor: Phosh pauses media when the output stops being headphones,
# and it only counts a sink if its form factor says so or its port is
# exactly "[Out] Headphones". Without this, unplugging from the Hi-Fi DAC
# kept playing on the loudspeaker.
#
# Suspend timeout: both headphone outputs share the jack, and the ES9218P
# gives it back to the regular headphones only once the Hi-Fi DAC's PCM
# closes. WirePlumber closes an idle sink after 5 s by default, so switching
# a playing stream from the Hi-Fi DAC to the regular headphones left 5 s of
# silence. 1 s keeps the gap short. 0 would mean "never suspend", which
# would let the DAC keep the jack for good.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones_Hi-Fi_DAC__sink" }
    ]
    actions = {
      update-props = {
        device.form_factor = "headphone"
        session.suspend-timeout-seconds = 1
      }
    }
  }
]
