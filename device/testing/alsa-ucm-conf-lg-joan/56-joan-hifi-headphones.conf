# joan (LG V30): mark the Hi-Fi DAC sink as headphones. Phosh pauses media when
# the output stops being headphones, and it only counts a sink if its form
# factor says so or its port is exactly "[Out] Headphones". Without this,
# unplugging from Hi-Fi kept playing on the loudspeaker.
monitor.alsa.rules = [
  {
    matches = [
      { node.name = "alsa_output.platform-sound.HiFi__Headphones2__sink" }
    ]
    actions = {
      update-props = {
        device.form_factor = "headphone"
      }
    }
  }
]
