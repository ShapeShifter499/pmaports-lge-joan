# LG V30 (joan): UCM entry point.
#
# alsa-lib finds this as conf.d/sdm845/LG-V30.conf (card driver "sdm845",
# card long name "LG-V30"); that file is a symlink to this one, the same
# layout the sdm845 phones use (conf.d/sdm845/OnePlus 6.conf ->
# OnePlus/enchilada/enchilada.conf).

Syntax 4

SectionUseCase."HiFi" {
	File "/LG/joan/HiFi.conf"
	Comment "HiFi quality Music."
}

Include.card-init.File "/lib/card-init.conf"
Include.ctl-remap.File "/lib/ctl-remap.conf"

BootSequence [
	# Each SLIMbus capture interface carries exactly one TX port. wcd934x
	# sizes a capture stream from the TX ports enabled on its AIF, and the
	# ADSP rejects the AFE port if that does not match, so clear every port
	# first (LG's own mixer_paths does the same at boot), then enable the
	# three that HiFi.conf uses.
	cset "name='AIF1_CAP Mixer SLIM TX0' 0"
	cset "name='AIF1_CAP Mixer SLIM TX1' 0"
	cset "name='AIF1_CAP Mixer SLIM TX2' 0"
	cset "name='AIF1_CAP Mixer SLIM TX3' 0"
	cset "name='AIF1_CAP Mixer SLIM TX4' 0"
	cset "name='AIF1_CAP Mixer SLIM TX5' 0"
	cset "name='AIF1_CAP Mixer SLIM TX7' 0"
	cset "name='AIF1_CAP Mixer SLIM TX8' 0"
	cset "name='AIF2_CAP Mixer SLIM TX0' 0"
	cset "name='AIF2_CAP Mixer SLIM TX1' 0"
	cset "name='AIF2_CAP Mixer SLIM TX2' 0"
	cset "name='AIF2_CAP Mixer SLIM TX3' 0"
	cset "name='AIF2_CAP Mixer SLIM TX4' 0"
	cset "name='AIF2_CAP Mixer SLIM TX5' 0"
	cset "name='AIF2_CAP Mixer SLIM TX6' 0"
	cset "name='AIF2_CAP Mixer SLIM TX8' 0"
	cset "name='AIF3_CAP Mixer SLIM TX1' 0"
	cset "name='AIF3_CAP Mixer SLIM TX2' 0"
	cset "name='AIF3_CAP Mixer SLIM TX3' 0"
	cset "name='AIF3_CAP Mixer SLIM TX4' 0"
	cset "name='AIF3_CAP Mixer SLIM TX5' 0"
	cset "name='AIF3_CAP Mixer SLIM TX6' 0"
	cset "name='AIF3_CAP Mixer SLIM TX7' 0"
	cset "name='AIF3_CAP Mixer SLIM TX8' 0"

	# The ADSP's TX processing chain. "None" is bit-transparent. LG's
	# calibration asks for SM ECNS / DM Fluence, but SM ECNS makes the COPP
	# open fail and the mic go silent on this firmware, so stay transparent.
	cset "name='TX COPP Topology' None"

	# Speaker: TDMSPKG on the TFA9872, 0..15 with 15 loudest. mainline's
	# tfa989x bypasses the CoolFlux DSP, so there is no speaker protection;
	# start well short of maximum.
	cset "name='Speaker Playback Volume' 8"

	# Earpiece. RXn Digital Volume and DECn Volume are S8 TLV controls over
	# (-84, +40): the value is an OFFSET FROM MIN, so 84 is 0 dB.
	cset "name='RX0 Digital Volume' 84"
	cset "name='EAR PA Volume' 4"

	# Headphones through the WCD (Low Power Bypass). 20 of 24 is LG's value.
	cset "name='RX1 Digital Volume' 84"
	cset "name='RX2 Digital Volume' 84"
	cset "name='HPHL Volume' 20"
	cset "name='HPHR Volume' 20"

	# Headphones through the ES9218P: 0 dB is full scale and uncomfortably
	# loud, so start near -30 dB.
	cset "name='Headphone Playback Volume' 195"

	# Mic gains: ADCn Volume is an analog 0..20 gain, 12 is LG's handset value.
	cset "name='ADC1 Volume' 12"
	cset "name='ADC2 Volume' 12"
	cset "name='ADC3 Volume' 12"
	cset "name='DEC6 Volume' 84"
	cset "name='DEC7 Volume' 84"
	cset "name='DEC0 Volume' 84"
]
