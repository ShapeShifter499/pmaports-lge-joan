# joan (LG V30): no "Pro Audio" profile for the built-in card.
#
# To build that profile the sound server opens every PCM of the card and
# tries stream formats on each, at every session start. On this card the
# PCMs are DSP frontends that only work once UCM has routed them, and the
# FM radio one only answers while the receiver is on, so the probe can
# only fail: it logged a string of kernel errors per login and woke the
# second SLIMbus engine each time. The UCM profiles are the ones that work.
monitor.alsa.rules = [
  {
    matches = [
      { device.name = "alsa_card.platform-sound" }
    ]
    actions = {
      update-props = {
        api.acp.disable-pro-audio = true
      }
    }
  }
]
